services:
  db:
    image: pgvector/pgvector:pg16
    container_name: contexdex-db
    environment:
      POSTGRES_USER: contexdex
      POSTGRES_PASSWORD: contexdex
      POSTGRES_DB: contexdex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
